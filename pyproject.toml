[project]
name = "agent-tips"
version = "1.0.0"
description = "Do tips for AI coding agents actually help? Fair comparisons from logged agent runs."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rajan Yadav", email = "rajanyadav0307@gmail.com" }]
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.10",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# Optional model training. CUDA wheels on Linux/Windows, Apple MPS on macOS.
gpu = ["torch>=2.7"]

[project.scripts]
agent-tips = "agent_tips.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tips"]

# ---- uv: lock for the four supported platforms --------------------------
[tool.uv]
default-groups = ["dev"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ---- Code quality ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["analysis/exploratory", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "D"]
# E501: the formatter wraps code; long SQL and report strings are kept readable.
ignore = ["D105", "D107", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "statsmodels.*", "scipy.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=agent_tips --cov-report=term-missing"
