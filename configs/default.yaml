# Default settings. Paths are relative to the project root and work on every platform.
seed: 0

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: outputs/results
  figures: outputs/figures

datasets:
  older_ai:
    hf_id: nebius/SWE-agent-trajectories
    model_name: swe-agent-llama-70b
  newer_ai_nebius:
    hf_id: nebius/SWE-rebench-openhands-trajectories
  newer_ai_nvidia:
    hf_id: nvidia/Open-SWE-Traces
    subsets:
      - sweagent/minimax_m25/swe-rebench-v2
      - sweagent/qwen35_122b/swe-rebench-v2
      - sweagent/qwen36_27b/scale-swe
      - sweagent/qwen36_27b/swe-rebench-v2
      - openhands/minimax_m25/swe-rebench-v2
      - openhands/qwen35_122b/swe-rebench-v2
      - openhands/deepseek_v4_flash_0731/scale-swe

analysis:
  bootstrap_reps: 2000
  permutation_reps: 1000
  fdr_alpha: 0.05

compute:
  device: auto   # auto | cpu | cuda | mps
